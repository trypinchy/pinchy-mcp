limit_req_zone $http_cf_connecting_ip zone=pinchy_mcp:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mcp.trypinchy.com;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/mcp.trypinchy.com.error.log crit;
    client_max_body_size 64k;

    limit_req zone=pinchy_mcp burst=30 nodelay;
    limit_req_status 429;

    location = /mcp {
        proxy_pass http://127.0.0.1:4020/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:4020/healthz;
    }

    location / {
        return 404;
    }
}
